databases:
  - name: quickbite-postgres
    databaseName: quickbite
    user: postgres
    plan: free

redis:
  - name: quickbite-redis
    plan: free

services:
  # Microservices
  - type: web
    name: auth-service
    env: docker
    dockerFilePath: QuickBite.Auth/Dockerfile
    dockerContext: QuickBite.Auth
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: quickbite-postgres
          property: connectionString

  - type: web
    name: restaurant-service
    env: docker
    dockerFilePath: QuickBite.Restaurant/Dockerfile
    dockerContext: QuickBite.Restaurant
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: quickbite-postgres
          property: connectionString
      - key: ConnectionStrings__Redis
        fromRedis:
          name: quickbite-redis
          property: connectionString

  - type: web
    name: menu-service
    env: docker
    dockerFilePath: QuickBite.Menu/Dockerfile
    dockerContext: QuickBite.Menu
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: quickbite-postgres
          property: connectionString
      - key: ConnectionStrings__Redis
        fromRedis:
          name: quickbite-redis
          property: connectionString

  - type: web
    name: cart-service
    env: docker
    dockerFilePath: QuickBite.Cart/Dockerfile
    dockerContext: QuickBite.Cart
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: quickbite-postgres
          property: connectionString
      - key: ConnectionStrings__Redis
        fromRedis:
          name: quickbite-redis
          property: connectionString

  - type: web
    name: order-service
    env: docker
    dockerFilePath: QuickBite.Order/Dockerfile
    dockerContext: QuickBite.Order
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: quickbite-postgres
          property: connectionString
      - key: Services__CartUrl
        value: http://cart-service:10000/
      - key: Services__PaymentUrl
        value: http://payment-service:10000/

  - type: web
    name: payment-service
    env: docker
    dockerFilePath: QuickBite.Payment/Dockerfile
    dockerContext: QuickBite.Payment
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: quickbite-postgres
          property: connectionString

  - type: web
    name: delivery-service
    env: docker
    dockerFilePath: QuickBite.Delivery/Dockerfile
    dockerContext: QuickBite.Delivery
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: quickbite-postgres
          property: connectionString

  - type: web
    name: notification-service
    env: docker
    dockerFilePath: QuickBite.Notification/Dockerfile
    dockerContext: QuickBite.Notification
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: quickbite-postgres
          property: connectionString

  - type: web
    name: gateway-service
    env: docker
    dockerFilePath: QuickBite.Gateway/Dockerfile
    dockerContext: QuickBite.Gateway
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ReverseProxy__Clusters__auth-cluster__Destinations__destination1__Address
        value: http://auth-service:10000/
      - key: ReverseProxy__Clusters__restaurant-cluster__Destinations__destination1__Address
        value: http://restaurant-service:10000/
      - key: ReverseProxy__Clusters__menu-cluster__Destinations__destination1__Address
        value: http://menu-service:10000/
      - key: ReverseProxy__Clusters__cart-cluster__Destinations__destination1__Address
        value: http://cart-service:10000/
      - key: ReverseProxy__Clusters__order-cluster__Destinations__destination1__Address
        value: http://order-service:10000/
      - key: ReverseProxy__Clusters__payment-cluster__Destinations__destination1__Address
        value: http://payment-service:10000/
      - key: ReverseProxy__Clusters__delivery-cluster__Destinations__destination1__Address
        value: http://delivery-service:10000/
      - key: ReverseProxy__Clusters__notification-cluster__Destinations__destination1__Address
        value: http://notification-service:10000/
